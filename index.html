<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資訊管理課程－科技接受度研究</title>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
window.mermaid = mermaid;
mermaid.initialize({
  startOnLoad: false,
  securityLevel: 'loose',
  theme: 'base',
  flowchart: { curve: 'basis', htmlLabels: true }
});
</script>
<style>
:root {
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#1f2937;
  --muted:#667085;
  --primary:#3458d4;
  --primary-2:#e8edff;
  --border:#d9e1ec;
  --shadow:0 10px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:118px 1fr}
.topbar{
  background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 72%, black));
  color:white;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;gap:20px
}
.title-wrap h1{margin:0;font-size:clamp(22px,3vw,36px);letter-spacing:.5px}
.title-wrap p{margin:7px 0 0;opacity:.9;font-size:14px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control-group{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.13);padding:8px 10px;border-radius:12px}
.control-group label{font-size:13px;opacity:.9}
select,button{font:inherit}
select{
  border:1px solid rgba(255,255,255,.35);background:#fff;color:#111827;border-radius:9px;padding:7px 10px;outline:none
}
.main{display:grid;grid-template-columns:280px 1fr;min-height:0}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:18px;overflow:auto}
.sidebar h3{margin:4px 0 14px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-btn{
  width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--text);
  padding:13px 14px;border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:650;transition:.2s
}
.nav-btn:hover{background:var(--primary-2)}
.nav-btn.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 28%, transparent)}
.content{padding:22px;overflow:auto;min-width:0}
.hero{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px
}
.hero h2{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:18px 0 10px}
.toolbar input{
  width:min(360px,100%);padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text)
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 5px 20px rgba(16,24,40,.05)
}
.rank{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;background:var(--primary);color:#fff;font-weight:800;margin-right:8px}
.card h3{display:inline;font-size:19px}
.card .en{display:block;color:var(--muted);font-size:13px;margin:8px 0}
.tags{margin:10px 0 12px;padding:10px 12px;background:var(--primary-2);border-radius:10px;font-size:13px}
.mermaid-box{overflow:auto;border:1px dashed var(--border);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--panel) 94%, var(--primary-2))}
.diagram-render svg{max-width:100%;height:auto;display:block;margin:auto}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--primary)}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;border-radius:10px;padding:12px;font-size:12px;overflow:auto}
.empty{padding:50px;text-align:center;color:var(--muted)}
.theme-dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.75)}
@media(max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:auto auto}
  .topbar{align-items:flex-start;flex-direction:column}
  .main{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .sidebar h3{grid-column:1/-1}
  .nav-btn{margin:0}
}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="title-wrap">
      <h1 id="pageTitle">資訊管理課程－科技接受度研究</h1>
      <p id="pageSubtitle">從接受意圖、實際行為、滿意度、持續使用、行為改變到關鍵成功因素</p>

    <div class="controls">
      <div class="control-group">
        <label id="themeLabel">色系</label>
        <select id="themeSelect">
          <option value="indigo">靛藍</option>
          <option value="emerald">翡翠綠</option>
          <option value="rose">玫瑰紅</option>
          <option value="amber">琥珀金</option>
          <option value="slate">石墨灰</option>

      </div>
      <div class="control-group">
        <label id="langLabel">語言</label>

          <option value="zh">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <h3 id="menuTitle">研究主題</h3>
      <button class="nav-btn active" data-key="acceptance_intention"></button>
      <button class="nav-btn" data-key="acceptance_behavior"></button>
      <button class="nav-btn" data-key="satisfaction"></button>
      <button class="nav-btn" data-key="continuance"></button>
      <button class="nav-btn" data-key="behavior_change"></button>
      <button class="nav-btn" data-key="csf"></button>
    </aside>

    <main class="content">
      <section class="hero">
        <h2 id="sectionTitle"></h2>
        <p id="sectionIntro"></p>
      </section>
      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="搜尋模型或關鍵字">
      </div>
      <section id="cards" class="cards"></section>
    </main>
  </div>
</div>

function applyTheme(name){
  const t = THEMES[name];
  document.documentElement.style.setProperty('--primary', t.primary);
  document.documentElement.style.setProperty('--primary-2', t.primary2);
  document.documentElement.style.setProperty('--bg', t.bg);
}

function updateStaticUI(){
  const ui = UI[currentLang];
  document.getElementById('pageTitle').textContent = ui.title;
  document.getElementById('pageSubtitle').textContent = ui.subtitle;
  document.getElementById('themeLabel').textContent = ui.theme;
  document.getElementById('langLabel').textContent = ui.lang;
  document.getElementById('menuTitle').textContent = ui.menu;
  document.getElementById('searchBox').placeholder = ui.search;
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const key = btn.dataset.key;
    const item = DATA[key];
    if(currentLang === 'zh') btn.textContent = item.zh;
    else if(currentLang === 'en') btn.textContent = item.en;
    else btn.textContent = LOCALE[currentLang].sections[key][0];
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function localizeMermaid(code, lang){
  if(lang === 'zh') return code;
  const map = MERMAID_TERM_MAP[lang];
  if(!map) return code;
  let out = code;
  Object.keys(map)
    .sort((a,b)=>b.length-a.length)
    .forEach(k => { out = out.split(k).join(map[k]); });
  return out;
}

async function render(){
  const section = DATA[currentKey];
  if(currentLang === 'zh'){
    document.getElementById('sectionTitle').textContent = section.zh;
    document.getElementById('sectionIntro').textContent = section.intro_zh;
  } else if(currentLang === 'en'){
    document.getElementById('sectionTitle').textContent = section.en;
    document.getElementById('sectionIntro').textContent = section.intro_en;
  } else {
    document.getElementById('sectionTitle').textContent = LOCALE[currentLang].sections[currentKey][0];
    document.getElementById('sectionIntro').textContent = LOCALE[currentLang].sections[currentKey][1];
  }

  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const models = section.models.filter(m => {
    const hay = m.join(' ').toLowerCase();
    return !q || hay.includes(q);
  });

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  const ui = UI[currentLang];

  models.forEach((m,i)=>{
    const [abbr, zh, en, constructs_zh, constructs_en, mer] = m;
    const localizedMer = localizeMermaid(mer, currentLang);
    let title, sub, constructs;
    if(currentLang==='zh'){
      title = zh; sub = en; constructs = constructs_zh;
    } else if(currentLang==='en'){
      title = en; sub = zh; constructs = constructs_en;
    } else {
      const loc = LOCALE[currentLang].models[abbr];
      title = loc ? loc[0] : en;
      sub = en;
      constructs = loc ? loc[1] : constructs_en;
    }

    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div><span class="rank">${i+1}</span><h3>${esc(abbr)} · ${esc(title)}</h3></div>
      <span class="en">${esc(sub)}</span>
      <div class="tags"><strong>${ui.concepts}：</strong>${esc(constructs)}</div>
      <div class="mermaid-box">
        <div class="diagram-render" data-code="${encodeURIComponent(localizedMer)}"></div>
      </div>
      <details>
        <summary>${ui.mermaid}</summary>
        <pre><code>${esc(localizedMer)}</code></pre>
      </details>`;
    cards.appendChild(card);
  });

  if(window.mermaid){
    const seq = ++mermaidRenderSeq;
    const nodes = [...document.querySelectorAll('.diagram-render')];
    for(let i=0;i<nodes.length;i++){
      const node = nodes[i];
      const code = decodeURIComponent(node.dataset.code || '');
      try{
        const id = `mmd-${currentLang}-${seq}-${i}`;
        const result = await window.mermaid.render(id, code);
        // If the user switched language again while this diagram was rendering,
        // do not inject an outdated SVG.
        if(seq !== mermaidRenderSeq) return;
        node.innerHTML = result.svg;
        if(result.bindFunctions) result.bindFunctions(node);
      }catch(e){
        node.innerHTML = `<pre style="margin:0;color:#b42318">${esc(code)}</pre>`;
        console.warn('Mermaid render error:', e);
      }
    }
  }
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    currentKey = btn.dataset.key;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('searchBox').value='';
    await render();
  });
});

document.getElementById('langSelect').addEventListener('change', async e=>{
  currentLang = e.target.value;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : currentLang;
  mermaidRenderSeq++;
  document.getElementById('cards').innerHTML = '';
  updateStaticUI();
  await render();
});

document.getElementById('themeSelect').addEventListener('change', e=>applyTheme(e.target.value));
document.getElementById('searchBox').addEventListener('input', render);

applyTheme('indigo');
updateStaticUI();
window.addEventListener('load', render);
</script>
